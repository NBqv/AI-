<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模板评审 — Voice Draw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #1a1a2e; color: #eee; }
  #app { max-width: 1000px; margin: 0 auto; padding: 20px; }

  /* Header */
  h1 { font-size: 22px; margin-bottom: 4px; color: #fff; }
  #progress { font-size: 14px; color: #888; margin-bottom: 16px; }

  /* Canvas area */
  #canvas-wrap {
    position: relative; background: #fff; border-radius: 8px;
    margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    width: fit-content; overflow: hidden;
  }
  #canvas-wrap canvas { display: block; }

  /* Info bar */
  #info {
    display: flex; align-items: center; justify-content: space-between;
    margin: 12px 0; padding: 0 4px;
  }
  #name { font-size: 24px; font-weight: bold; color: #fff; }
  #aliases { font-size: 13px; color: #999; margin-top: 2px; }
  #action-count { font-size: 12px; color: #666; }

  /* Navigation */
  #nav { display: flex; align-items: center; gap: 12px; margin: 16px 0; justify-content: center; }
  #nav button {
    padding: 8px 20px; font-size: 16px; border: none; border-radius: 6px;
    cursor: pointer; background: #16213e; color: #fff; transition: all .15s;
  }
  #nav button:hover { background: #0f3460; }
  #nav button:disabled { opacity: .3; cursor: default; }
  #nav #counter { font-size: 14px; color: #aaa; min-width: 80px; text-align: center; }

  /* Rating */
  #rating { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
  #rating button {
    padding: 10px 24px; font-size: 16px; border: 2px solid transparent;
    border-radius: 8px; cursor: pointer; transition: all .15s; font-weight: bold;
  }
  #rating .btn-good { background: #1a3a2a; color: #4caf50; }
  #rating .btn-good:hover, #rating .btn-good.active { background: #4caf50; color: #fff; border-color: #4caf50; }
  #rating .btn-bad { background: #3a1a1a; color: #f44336; }
  #rating .btn-bad:hover, #rating .btn-bad.active { background: #f44336; color: #fff; border-color: #f44336; }
  #rating .btn-skip { background: #2a2a3a; color: #888; }
  #rating .btn-skip:hover { background: #444; }

  /* Note */
  #note-wrap { margin: 12px 0; display: flex; gap: 8px; align-items: center; }
  #note {
    flex: 1; padding: 8px 12px; font-size: 14px; border: 1px solid #333;
    border-radius: 6px; background: #16213e; color: #fff; outline: none;
  }
  #note:focus { border-color: #4a90d9; }
  #save-note { padding: 8px 14px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; background: #4a90d9; color: #fff; }

  /* Stats bar */
  #stats {
    display: flex; gap: 16px; justify-content: center; margin: 16px 0;
    font-size: 14px; padding: 12px; background: #16213e; border-radius: 8px;
  }
  .stat-good { color: #4caf50; }
  .stat-bad { color: #f44336; }
  .stat-pending { color: #888; }
  .stat-total { color: #fff; }

  /* Export */
  #export-wrap { text-align: center; margin: 16px 0; }
  #export-btn {
    padding: 10px 28px; font-size: 15px; border: none; border-radius: 8px;
    cursor: pointer; background: #e94560; color: #fff; font-weight: bold;
  }
  #export-btn:hover { background: #c73650; }

  /* Bad list */
  #bad-list { margin-top: 20px; }
  #bad-list h3 { font-size: 16px; margin-bottom: 8px; color: #f44336; }
  #bad-list div { font-size: 13px; color: #aaa; line-height: 1.8; }
  #bad-list .bad-item { display: flex; align-items: center; gap: 8px; }
  #bad-list .bad-item .note { color: #888; font-size: 12px; }

  /* Keyboard hints */
  #hints { text-align: center; font-size: 12px; color: #555; margin-top: 8px; }
  kbd { background: #333; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <h1>🎨 模板视觉评审</h1>
  <div id="progress">正在加载模板...</div>

  <div id="canvas-wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <div id="info">
    <div>
      <div id="name">—</div>
      <div id="aliases"></div>
    </div>
    <div id="action-count"></div>
  </div>

  <div id="rating">
    <button class="btn-good" data-rating="good">👍 好看</button>
    <button class="btn-bad" data-rating="bad">👎 有问题</button>
    <button class="btn-skip" data-rating="skip">⏭️ 跳过</button>
  </div>

  <div id="note-wrap">
    <input id="note" placeholder="备注问题（坐标不对、不像、颜色怪...）按 Enter 保存">
    <button id="save-note">💾 保存</button>
  </div>

  <div id="nav">
    <button id="prev-btn" disabled>← 上一个</button>
    <span id="counter">0 / 0</span>
    <button id="next-btn">下一个 →</button>
  </div>

  <div id="stats">
    <span class="stat-good">✅ 通过: <span id="good-count">0</span></span>
    <span class="stat-bad">❌ 有问题: <span id="bad-count">0</span></span>
    <span class="stat-pending">⏳ 待评审: <span id="pending-count">0</span></span>
  </div>

  <div id="export-wrap">
    <button id="export-btn">📥 导出评审报告 (JSON)</button>
  </div>

  <div id="bad-list"></div>

  <div id="hints">
    <kbd>←</kbd> <kbd>→</kbd> 切换 &nbsp;·&nbsp;
    <kbd>1</kbd> 通过 <kbd>2</kbd> 有问题 <kbd>3</kbd> 跳过 &nbsp;·&nbsp;
    <kbd>Enter</kbd> 保存备注
  </div>
</div>

<script>
// ── Canvas Drawing (same as test_render) ──
function drawTemplate(ctx, actions) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, 800, 600);

  if (!actions) return;

  for (const cmd of actions) {
    const c = cmd.color || 'black';
    let pts = cmd.points;
    if (pts && pts.length > 0 && Array.isArray(pts[0])) {
      pts = pts.map(p => ({ x: p[0], y: p[1] }));
    }

    switch (cmd.action) {
      case 'drawCircle':
        ctx.beginPath(); ctx.arc(cmd.x ?? 400, cmd.y ?? 300, cmd.radius ?? 40, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill(); ctx.closePath();
        break;
      case 'drawEllipse':
        ctx.beginPath(); ctx.ellipse(cmd.x ?? 400, cmd.y ?? 300, cmd.radiusX ?? 50, cmd.radiusY ?? 30, 0, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill(); ctx.closePath();
        break;
      case 'drawRect':
        ctx.fillStyle = c; ctx.fillRect(cmd.x ?? 300, cmd.y ?? 200, cmd.width ?? 80, cmd.height ?? 60);
        break;
      case 'drawLine':
        ctx.beginPath(); ctx.moveTo(cmd.x1 ?? 200, cmd.y1 ?? 300);
        ctx.lineTo(cmd.x2 ?? 600, cmd.y2 ?? 300);
        ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke(); ctx.closePath();
        break;
      case 'drawPolygon':
      case 'drawTriangle':
        if (pts && pts.length >= 3) {
          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        }
        break;
      case 'drawArc':
        ctx.beginPath(); ctx.arc(cmd.x ?? 400, cmd.y ?? 300, cmd.radius ?? 40, cmd.startAngle ?? 0, cmd.endAngle ?? Math.PI);
        ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke(); ctx.closePath();
        break;
      case 'drawStar':
        if (pts) {
          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        } else {
          const cx = cmd.x ?? 400, cy = cmd.y ?? 300, r = cmd.radius ?? 40;
          const star = [];
          for (let i = 0; i < 10; i++) {
            const angle = (i * Math.PI * 2) / 10 - Math.PI / 2;
            const rad = i % 2 === 0 ? r : r * 0.4;
            star.push({ x: cx + rad * Math.cos(angle), y: cy + rad * Math.sin(angle) });
          }
          ctx.beginPath(); ctx.moveTo(star[0].x, star[0].y);
          for (let i = 1; i < star.length; i++) ctx.lineTo(star[i].x, star[i].y);
          ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        }
        break;
    }
  }
}

// ── Main App ──
let shapes = {};
let keys = [];
let currentIndex = 0;
let reviews = {};  // { key: { rating: 'good'|'bad'|'skip', note: '' } }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

async function init() {
  try {
    const r = await fetch('backend/aliases.json');
    const data = await r.json();
    shapes = data.complex_shapes || {};
    keys = Object.keys(shapes).sort();
    document.getElementById('progress').textContent = `已加载 ${keys.length} 个模板`;

    // Load saved reviews from localStorage
    try {
      const saved = localStorage.getItem('template_reviews');
      if (saved) reviews = JSON.parse(saved);
    } catch(e) {}

    showTemplate(currentIndex);
    updateStats();
    updateBadList();
  } catch (e) {
    document.getElementById('progress').textContent = '❌ 加载失败: ' + e.message;
  }
}

function showTemplate(index) {
  if (index < 0 || index >= keys.length) return;
  currentIndex = index;
  const name = keys[index];
  const tpl = shapes[name];

  // Render
  drawTemplate(ctx, tpl.actions);

  // Info
  document.getElementById('name').textContent = name;
  document.getElementById('aliases').textContent = (tpl.aliases || []).slice(0, 6).join(' · ');
  document.getElementById('action-count').textContent = (tpl.actions || []).length + ' 个动作';

  // Counter
  document.getElementById('counter').textContent = `${index + 1} / ${keys.length}`;

  // Navigation
  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === keys.length - 1;
  document.title = `${name} (${index + 1}/${keys.length}) — 模板评审`;

  // Restore rating
  const rev = reviews[name] || {};
  document.querySelectorAll('#rating button').forEach(b => {
    b.classList.toggle('active', b.dataset.rating === rev.rating);
  });
  document.getElementById('note').value = rev.note || '';
}

function setRating(rating) {
  const name = keys[currentIndex];
  if (!reviews[name]) reviews[name] = {};
  reviews[name].rating = rating;
  if (rating === 'good' || rating === 'bad') {
    reviews[name].note = document.getElementById('note').value || '';
  }
  saveReviews();
  showTemplate(currentIndex);
  updateStats();
  updateBadList();
}

function saveNote() {
  const name = keys[currentIndex];
  if (!reviews[name]) reviews[name] = {};
  reviews[name].note = document.getElementById('note').value;
  if (!reviews[name].rating) reviews[name].rating = 'skip';
  saveReviews();
  updateBadList();
}

function saveReviews() {
  localStorage.setItem('template_reviews', JSON.stringify(reviews));
}

function updateStats() {
  const good = Object.entries(reviews).filter(([,r]) => r.rating === 'good').length;
  const bad = Object.entries(reviews).filter(([,r]) => r.rating === 'bad').length;
  const done = good + bad + Object.entries(reviews).filter(([,r]) => r.rating === 'skip').length;
  const pending = keys.length - done;

  document.getElementById('good-count').textContent = good;
  document.getElementById('bad-count').textContent = bad;
  document.getElementById('pending-count').textContent = pending;
  document.getElementById('progress').textContent =
    `已评审 ${done}/${keys.length} 个   👍 ${good}  👎 ${bad}  ⏳ ${pending}`;
}

function updateBadList() {
  const badItems = Object.entries(reviews)
    .filter(([, r]) => r.rating === 'bad')
    .map(([name, r]) => ({ name, note: r.note || '' }));

  const el = document.getElementById('bad-list');
  if (badItems.length === 0) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = '<h3>❌ 待修正的模板</h3>' +
    badItems.map(({name, note}) =>
      `<div class="bad-item">
        <span style="color:#fff">${name}</span>
        ${note ? `<span class="note">— ${note}</span>` : ''}
      </div>`
    ).join('');
}

function exportReport() {
  const goodItems = Object.entries(reviews)
    .filter(([, r]) => r.rating === 'good').map(([n]) => n);
  const badItems = Object.entries(reviews)
    .filter(([, r]) => r.rating === 'bad').map(([n, r]) => ({ name: n, note: r.note || '' }));
  const skipItems = Object.entries(reviews)
    .filter(([, r]) => r.rating === 'skip').map(([n]) => n);
  const pending = keys.filter(k => !reviews[k] || !reviews[k].rating);

  const report = {
    date: new Date().toISOString(),
    total: keys.length,
    reviewed: goodItems.length + badItems.length + skipItems.length,
    good: goodItems,
    bad: badItems,
    skipped: skipItems,
    pending: pending,
  };

  const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `template-review-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Screenshot individual template ──
function screenshotCurrent() {
  // Create a full-size off-screen canvas
  const offscreen = document.createElement('canvas');
  offscreen.width = 800;
  offscreen.height = 600;
  const offCtx = offscreen.getContext('2d');
  const name = keys[currentIndex];
  drawTemplate(offCtx, shapes[name].actions);

  const link = document.createElement('a');
  link.download = `${name}.png`;
  link.href = offscreen.toDataURL('image/png');
  link.click();
}

// ── Event Listeners ──
document.getElementById('prev-btn').addEventListener('click', () => showTemplate(currentIndex - 1));
document.getElementById('next-btn').addEventListener('click', () => showTemplate(currentIndex + 1));

document.querySelectorAll('#rating button').forEach(btn => {
  btn.addEventListener('click', () => setRating(btn.dataset.rating));
});

document.getElementById('save-note').addEventListener('click', saveNote);
document.getElementById('note').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveNote();
});

document.getElementById('export-btn').addEventListener('click', exportReport);

// Add screenshot button to nav area
const nav = document.getElementById('nav');
const ssBtn = document.createElement('button');
ssBtn.textContent = '📸 截图保存';
ssBtn.style.cssText = 'padding:8px 16px;font-size:14px;border:none;border-radius:6px;cursor:pointer;background:#4a90d9;color:#fff;';
ssBtn.addEventListener('click', screenshotCurrent);
nav.appendChild(ssBtn);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;  // Don't intercept when typing in note
  switch (e.key) {
    case 'ArrowLeft': showTemplate(currentIndex - 1); break;
    case 'ArrowRight': showTemplate(currentIndex + 1); break;
    case '1': setRating('good'); break;
    case '2': setRating('bad'); break;
    case '3': setRating('skip'); break;
    case 's': screenshotCurrent(); break;
  }
});

init();
</script>
</body>
</html>
