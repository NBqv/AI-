<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>简笔画模板预览测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 22px; }
  #controls { text-align: center; margin-bottom: 16px; }
  #controls input { width: 300px; padding: 6px 10px; font-size: 14px; }
  #controls button { padding: 6px 14px; font-size: 14px; cursor: pointer; }
  #stats { text-align: center; margin-bottom: 16px; color: #666; font-size: 14px; }
  #grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .card {
    background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    padding: 10px; width: 180px; text-align: center;
  }
  .card canvas { display: block; margin: 0 auto; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
  .card .name { font-size: 13px; font-weight: bold; margin-top: 6px; color: #333; }
  .card .aliases { font-size: 11px; color: #888; margin-top: 2px; }
  .card .count { font-size: 10px; color: #aaa; }
  .card.pass { border-left: 3px solid #4caf50; }
  .card.fail { border-left: 3px solid #f44336; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
  .badge-err { background: #f44336; color: #fff; }
  .badge-warn { background: #ff9800; color: #fff; }
</style>
</head>
<body>
<h1>🎨 简笔画模板预览</h1>
<div id="controls">
  <input id="search" placeholder="搜索模板名称..." oninput="renderAll()">
  <button onclick="renderAll()">刷新全部</button>
  <span id="stats"></span>
</div>
<div id="grid"></div>

<script>
const CANVAS_W = 800, CANVAS_H = 600;

// ── 绘制核心（从 script.js 移植）──
function drawIt(ctx, actions) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  for (const cmd of actions) {
    const c = cmd.color || 'black';
    let pts = cmd.points;
    if (pts && pts.length > 0 && Array.isArray(pts[0])) {
      pts = pts.map(p => ({ x: p[0], y: p[1] }));
    }

    ctx.save();

    switch (cmd.action) {
      case 'drawCircle':
        ctx.beginPath(); ctx.arc(cmd.x ?? 400, cmd.y ?? 300, cmd.radius ?? 40, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill(); ctx.closePath();
        break;
      case 'drawEllipse':
        ctx.beginPath(); ctx.ellipse(cmd.x ?? 400, cmd.y ?? 300, cmd.radiusX ?? 50, cmd.radiusY ?? 30, 0, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill(); ctx.closePath();
        break;
      case 'drawRect':
        ctx.fillStyle = c; ctx.fillRect(cmd.x ?? 300, cmd.y ?? 200, cmd.width ?? 80, cmd.height ?? 60);
        break;
      case 'drawLine':
        ctx.beginPath(); ctx.moveTo(cmd.x1 ?? 200, cmd.y1 ?? 300);
        ctx.lineTo(cmd.x2 ?? 600, cmd.y2 ?? 300);
        ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke(); ctx.closePath();
        break;
      case 'drawPolygon':
      case 'drawTriangle':
        if (pts && pts.length >= 3) {
          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        }
        break;
      case 'drawArc':
        ctx.beginPath(); ctx.arc(cmd.x ?? 400, cmd.y ?? 300, cmd.radius ?? 40, cmd.startAngle ?? 0, cmd.endAngle ?? Math.PI);
        ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke(); ctx.closePath();
        break;
      case 'drawStar':
        if (pts) {
          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        } else {
          const cx = cmd.x ?? 400, cy = cmd.y ?? 300, r = cmd.radius ?? 40;
          const starPts = [];
          for (let i = 0; i < 10; i++) {
            const angle = (i * Math.PI * 2) / 10 - Math.PI / 2;
            const rad = i % 2 === 0 ? r : r * 0.4;
            starPts.push({ x: cx + rad * Math.cos(angle), y: cy + rad * Math.sin(angle) });
          }
          ctx.beginPath(); ctx.moveTo(starPts[0].x, starPts[0].y);
          for (let i = 1; i < starPts.length; i++) ctx.lineTo(starPts[i].x, starPts[i].y);
          ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        }
        break;
    }
    ctx.restore();
  }
}

async function loadTemplates() {
  const r = await fetch('backend/aliases.json');
  const data = await r.json();
  return data.complex_shapes || {};
}

function renderAll() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  loadTemplates().then(shapes => {
    const keys = Object.keys(shapes).filter(k => !query || k.includes(query));
    document.getElementById('stats').textContent = `显示 ${keys.length}/${Object.keys(shapes).length} 个模板`;

    const thumbW = 160;
    const scale = thumbW / CANVAS_W;

    // 获取验证结果
    let validation = {};
    try {
      const v = sessionStorage.getItem('validation');
      if (v) validation = JSON.parse(v);
    } catch(e) {}

    keys.forEach(name => {
      const tpl = shapes[name];
      const card = document.createElement('div');
      card.className = 'card';

      const canvas = document.createElement('canvas');
      canvas.width = thumbW;
      canvas.height = thumbW * (CANVAS_H / CANVAS_W);
      card.appendChild(canvas);

      const nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = name;
      card.appendChild(nameDiv);

      if (tpl.aliases) {
        const aliasDiv = document.createElement('div');
        aliasDiv.className = 'aliases';
        aliasDiv.textContent = tpl.aliases.slice(0, 5).join(' · ');
        card.appendChild(aliasDiv);
      }

      const countDiv = document.createElement('div');
      countDiv.className = 'count';
      countDiv.textContent = `${tpl.actions?.length || 0} 个动作`;
      card.appendChild(countDiv);

      grid.appendChild(card);

      // 渲染到小画布
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      drawIt(ctx, tpl.actions || []);
    });
  });
}

renderAll();
</script>
</body>
</html>
